<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>诺贝尔文学奖 · 作品与传承图谱</title>
<script src="../lib/vendors/d3.v7.min.js"></script>
<script src="../lib/vendors/echarts.min.js"></script>
<link rel="stylesheet" href="../css/style.css">
<style>
:root { --lit-bg: #f7f3ed; --lit-accent: #8B4513; --lit-secondary: #D2691E; }
body { background: var(--lit-bg); margin: 0; font-family: -apple-system, system-ui, sans-serif; }
.header { background: linear-gradient(135deg, #8B4513 0%, #A0522D 100%); color: white; padding: 2rem 3rem; }
.header h1 { margin: 0; font-size: 2rem; }
.header p { margin: 0.5rem 0 0; opacity: 0.9; }
.container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
.loading { text-align: center; padding: 4rem; color: #666; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
.card { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
.card h3 { margin: 0 0 1rem; color: var(--lit-accent); font-size: 1.1rem; border-left: 4px solid var(--lit-accent); padding-left: 0.75rem; }
.chart { width: 100%; height: 380px; }
.chart-wide { width: 100%; height: 500px; }
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
.stat-card { background: white; border-radius: 12px; padding: 1.25rem; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
.stat-num { font-size: 2.2rem; font-weight: 700; color: var(--lit-accent); }
.stat-label { color: #666; font-size: 0.9rem; margin-top: 0.3rem; }
.writer-list { max-height: 500px; overflow-y: auto; }
.writer-item { padding: 0.75rem; border-bottom: 1px solid #f0ebe4; cursor: pointer; transition: background 0.2s; }
.writer-item:hover { background: #faf7f2; }
.writer-year { color: var(--lit-secondary); font-size: 0.85rem; font-weight: 600; }
.writer-name { font-weight: 500; margin: 0.2rem 0; }
.writer-country { color: #888; font-size: 0.8rem; }
.full { grid-column: 1 / -1; }
.back-link { position: fixed; top: 1rem; left: 1rem; background: rgba(255,255,255,0.9); padding: 0.5rem 1rem; border-radius: 20px; text-decoration: none; color: var(--lit-accent); box-shadow: 0 2px 8px rgba(0,0,0,0.1); z-index: 100; }
.back-link:hover { background: white; }
/* 交互控件 */
.net-toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:8px; font-size:12px; }
.net-toolbar label { display:flex; align-items:center; gap:4px; color:#334; cursor:pointer; }
.net-toolbar select, .net-toolbar input[type="range"] { font-size:12px; padding:2px 4px; border:1px solid #cbd5e1; border-radius:4px; }
.net-toolbar .reset-btn { padding:4px 10px; background:#8B4513; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:12px; }
.net-toolbar .reset-btn:hover { background:#5d2f0d; }
.net-hint { font-size:11px; color:#888; margin-left:auto; }
.tooltip-net { position:fixed; background:rgba(255,255,255,0.98); border:1px solid var(--lit-accent); border-radius:8px; padding:10px 12px; max-width:300px; font-size:12px; pointer-events:none; z-index:200; box-shadow:0 4px 16px rgba(139,69,19,0.2); display:none; }
.tooltip-net h4 { font-size:13px; color:var(--lit-accent); margin:0 0 4px; }
.tooltip-net .meta { color:#666; font-size:11px; margin-bottom:6px; }
.tooltip-net .tag { display:inline-block; padding:1px 6px; border-radius:8px; font-size:11px; margin:1px; }
.tooltip-net .tag-move { background:#f0e6d8; color:#8B4513; }
.tooltip-net .tag-genre { background:#e6f0d8; color:#5d7a2f; }
#chart_network { background:#fff; border-radius:8px; }
.net-node circle { cursor:pointer; stroke:#fff; stroke-width:1.5px; transition:all .2s; }
.net-node:hover circle { stroke:#ffc107; stroke-width:2.5px; filter:drop-shadow(0 0 6px #ffc107); }
.net-node text { font-size:9px; fill:#333; pointer-events:none; text-shadow:0 1px 2px rgba(255,255,255,.9); }
.net-node.dim { opacity:.15; }
.net-link { fill:none; transition:all .2s; }
.net-link.dim { opacity:.05; }
.net-link.active { stroke:#ffc107 !important; stroke-opacity:1 !important; stroke-width:2.5px !important; }
.writer-item.active { background:#f5ede0; border-left:3px solid var(--lit-accent); }
</style>
</head>
<body>
<a href="../index.html" class="back-link">← 返回主页</a>
<div class="tooltip-net" id="tip"></div>
<div class="header">
  <h1>📖 诺贝尔文学奖 · 作品与传承图谱</h1>
  <p>1901-2026 · 123位得主 · 作品、流派、语言、地域的多维可视化</p>
</div>
<div class="container">
  <div class="loading" id="loading">正在加载本体数据…</div>
  <div id="content" style="display:none">
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num" id="s1">0</div><div class="stat-label">获奖作家</div></div>
      <div class="stat-card"><div class="stat-num" id="s2">0</div><div class="stat-label">国家/地区</div></div>
      <div class="stat-card"><div class="stat-num" id="s3">0</div><div class="stat-label">文学流派</div></div>
      <div class="stat-card"><div class="stat-num" id="s4">0</div><div class="stat-label">可考影响关系</div></div>
    </div>
    <div class="grid">
      <div class="card">
        <h3>🏆 历年获奖人数（按国家）</h3>
        <div id="chart_year" class="chart-wide"></div>
      </div>
    </div>
    <div class="grid">
      <div class="card">
        <h3>🌍 获奖国家分布</h3>
        <div id="chart_country" class="chart"></div>
      </div>
      <div class="card">
        <h3>📚 作品体裁分布</h3>
        <div id="chart_genre" class="chart"></div>
      </div>
    </div>
    <div class="grid">
      <div class="card full">
        <h3>🌱 文学流派传承网络</h3>
        <div class="net-toolbar">
          <label><input type="checkbox" id="litShowMove" checked> 流派</label>
          <label><input type="checkbox" id="litShowWriter" checked> 作家</label>
          <label><input type="checkbox" id="litShowBelong" checked> 归属边</label>
          <label><input type="checkbox" id="litShowInfluence" checked> 影响边</label>
          <select id="litColorMode">
            <option value="type">按类型着色</option>
            <option value="movement">按流派着色</option>
            <option value="decade">按年代着色</option>
            <option value="gender">按性别着色</option>
          </select>
          <select id="litMoveFilter"><option value="">全部流派</option></select>
          <select id="litGenreFilter"><option value="">全部体裁</option></select>
          <select id="litGenderFilter"><option value="">全部性别</option><option value="male">男</option><option value="female">女</option></select>
          <label style="display:flex;align-items:center;gap:4px;">年份≥<input type="range" id="litYearRange" min="1901" max="2020" step="5" value="1901" style="width:100px;"> <span id="litYearLabel" style="font-weight:600;">1901</span></label>
          <button class="reset-btn" id="litReset">清除高亮</button>
          <span class="net-hint">滚轮缩放 · 拖拽节点 · 点击高亮链路 · 双击重置</span>
        </div>
        <svg id="chart_network" width="100%" height="550"></svg>
      </div>
    </div>
    <div class="grid">
      <div class="card">
        <h3>📅 世纪分布</h3>
        <div id="chart_century" class="chart"></div>
      </div>
      <div class="card">
        <h3>📋 作家名录</h3>
        <div class="writer-list" id="writer_list"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import * as db from '../js/db.js';
const log = msg => document.getElementById('loading').textContent = msg;

await db.initDB(log);
log('正在查询文学奖数据…');

// 查数据
const writers = (await db.query('SELECT * FROM writers ORDER BY nobel_year')).rows;
const movements = (await db.query('SELECT * FROM literary_movements')).rows;
const genres = (await db.query('SELECT * FROM literary_genres')).rows;
const wm = (await db.query('SELECT * FROM writer_movement')).rows;
const wg = (await db.query('SELECT * FROM writer_genre')).rows;
const influence = (await db.query('SELECT * FROM literary_influence')).rows;

// 统计
const countries = new Set(writers.map(w=>w.country));
document.getElementById('s1').textContent = writers.length;
document.getElementById('s2').textContent = countries.size;
document.getElementById('s3').textContent = movements.length;
document.getElementById('s4').textContent = influence.length;

document.getElementById('loading').style.display = 'none';
document.getElementById('content').style.display = 'block';

// 作家名录
const wl = document.getElementById('writer_list');
writers.forEach(w => {
  const div = document.createElement('div');
  div.className = 'writer-item';
  div.innerHTML = `
    <div class="writer-year">${w.nobel_year}年</div>
    <div class="writer-name">${w.name_en}${w.name_native?'（'+w.name_native+'）':''}</div>
    <div class="writer-country">${w.country}${w.gender==='female'?' · 女作家':''}</div>
  `;
  wl.appendChild(div);
});

// 国家分布饼图
const countryCount = {};
writers.forEach(w=>{ countryCount[w.country] = (countryCount[w.country]||0)+1; });
const countryData = Object.entries(countryCount).map(([k,v])=>({name:k,value:v})).sort((a,b)=>b.value-a.value).slice(0,12);
echarts.init(document.getElementById('chart_country')).setOption({
  tooltip: { trigger:'item' },
  series: [{ type:'pie', radius:['40%','70%'], data:countryData, label:{formatter:'{b}: {c}'},
    itemStyle:{borderRadius:6,borderColor:'#fff',borderWidth:2} }]
});

// 体裁分布
const genreCount = {};
wg.forEach(r=>{ const g = genres.find(x=>x.genre_id===r.genre_id); if(g) genreCount[g.name_zh]=(genreCount[g.name_zh]||0)+1; });
const genreData = Object.entries(genreCount).map(([k,v])=>({name:k,value:v}));
echarts.init(document.getElementById('chart_genre')).setOption({
  tooltip: { trigger:'item' },
  series: [{ type:'pie', radius:'70%', data:genreData,
    itemStyle:{borderRadius:6,borderColor:'#fff',borderWidth:2} }]
});

// 世纪分布
const centuryCount = {'20世纪前':0,'20世纪上半叶(1901-1950)':0,'20世纪下半叶(1951-2000)':0,'21世纪(2001-)':0};
writers.forEach(w=>{
  const y = w.nobel_year;
  if(y<1901) centuryCount['20世纪前']++;
  else if(y<=1950) centuryCount['20世纪上半叶(1901-1950)']++;
  else if(y<=2000) centuryCount['20世纪下半叶(1951-2000)']++;
  else centuryCount['21世纪(2001-)']++;
});
echarts.init(document.getElementById('chart_century')).setOption({
  tooltip: {}, xAxis:{type:'category',data:Object.keys(centuryCount)},
  yAxis:{type:'value'}, series:[{type:'bar',data:Object.values(centuryCount),itemStyle:{color:'#A0522D',borderRadius:[6,6,0,0]}}]
});

// 历年国家时间线
const yearMin = Math.min(...writers.map(w=>w.nobel_year));
const yearMax = Math.max(...writers.map(w=>w.nobel_year));
const years = [];
for(let y=yearMin;y<=yearMax;y++) years.push(y);
const countryTop = countryData.slice(0,6).map(x=>x.name);
const series = countryTop.map(c=>({
  name:c, type:'bar', stack:'total',
  data: years.map(y => writers.filter(w=>w.nobel_year===y && w.country===c).length)
}));
echarts.init(document.getElementById('chart_year')).setOption({
  tooltip:{trigger:'axis'}, legend:{data:countryTop,bottom:0},
  grid:{left:40,right:20,top:20,bottom:50},
  xAxis:{type:'category',data:years}, yAxis:{type:'value'},
  series
});

// 流派网络力导向图（带缩放/tooltip/高亮/筛选）
const svg = d3.select('#chart_network');
const width = svg.node().getBoundingClientRect().width;
const height = 550;
svg.attr('viewBox',`0 0 ${width} ${height}`);

// 流派色板
const moveColors = {};
movements.forEach((m,i)=>{ moveColors[m.movement_id] = ['#8B4513','#D2691E','#A0522D','#CD853F','#BC8F8F','#BDB76B','#556B2F','#2F4F4F','#654321','#8B0000','#483D8B','#00868B','#708090','#9370DB'][i%14]; });

// 作家→流派映射
const writerMoves = {};
wm.forEach(r=>{ if(!writerMoves[r.writer_id]) writerMoves[r.writer_id]=[]; writerMoves[r.writer_id].push(r.movement_id); });
// 作家→体裁映射
const writerGenres = {};
wg.forEach(r=>{ if(!writerGenres[r.writer_id]) writerGenres[r.writer_id]=[]; writerGenres[r.writer_id].push(r.genre_id); });

const nodes = [
  ...movements.map(m=>({id:m.movement_id,name:m.name_zh,type:'movement',r: 20 + wm.filter(w=>w.movement_id===m.movement_id).length*2,_rec:m})),
  ...writers.map(w=>({id:w.writer_id,name:w.name_en.split(' ').slice(-1)[0],type:'writer',r:6,_rec:w}))
];
// 归属边（作家-流派）
const belongLinks = wm.map(r=>({source:r.writer_id,target:r.movement_id,type:'belong'}));
// 影响边（influenced_id ← influencer_id，仅当 influencer_id 指向已知节点时纳入）
const inflLinks = influence.map(r=>{
  const src = r.influenced_id;
  const tgt = r.influencer_id;
  if(!src || !tgt) return null;
  return {source:src, target:tgt, type:'influence'};
}).filter(l=>l && nodes.find(n=>n.id===l.source) && nodes.find(n=>n.id===l.target));

function nodeColor(d){
  const mode = document.getElementById('litColorMode').value;
  if(mode==='movement'){
    if(d.type==='movement') return moveColors[d.id]||'#8B4513';
    const my = writerMoves[d.id] && writerMoves[d.id][0];
    return my ? moveColors[my] : '#D2B48C';
  }
  if(mode==='decade'){
    const y = d._rec && d._rec.nobel_year;
    if(!y) return '#8B4513';
    const decade = Math.floor(y/10)*10;
    const map = {1900:'#4a5568',1910:'#805ad5',1920:'#2b6cb0',1930:'#c05621',1940:'#dd6b20',1950:'#38a169',1960:'#2f855a',1970:'#b7791f',1980:'#9b2c2c',1990:'#319795',2000:'#553c9a',2010:'#2c5282'};
    return map[decade] || '#64748b';
  }
  if(mode==='gender'){
    if(d.type==='movement') return '#8B4513';
    const g = d._rec && d._rec.gender;
    if(g==='female') return '#d53f8c';
    if(g==='male') return '#4a90d9';
    return '#a0a0a0';
  }
  // type
  return d.type==='movement' ? '#8B4513' : '#D2B48C';
}

// 边数据合并
const links = [...belongLinks, ...inflLinks];
const totalLinks = links.length;
const belongLinkCount = belongLinks.length;

// Zoom
const zoom = d3.zoom().scaleExtent([0.2,4]).on('zoom',e=>{ g.attr('transform',e.transform); });
svg.call(zoom).on('dblclick.zoom',null);
svg.on('dblclick',()=>{ svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity); resetHighlight(); });

const g = svg.append('g');
const link = g.append('g').selectAll('line').data(links).join('line')
  .attr('class','net-link')
  .attr('stroke', d=>d.type==='belong' ? '#8B4513' : '#9c27b0')
  .attr('stroke-opacity', d=>d.type==='belong' ? 0.4 : 0.35)
  .attr('stroke-width', d=>d.type==='belong' ? 1.5 : 1)
  .attr('stroke-dasharray', d=>d.type==='influence' ? '4 2' : null);

const node = g.append('g').selectAll('g').data(nodes).join('g')
  .attr('class','net-node')
  .call(d3.drag()
    .on('start',(e,d)=>{if(!e.active) simulation.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y;})
    .on('drag',(e,d)=>{ d.fx=e.x; d.fy=e.y; })
    .on('end',(e,d)=>{ if(!e.active) simulation.alphaTarget(0); d.fx=null; d.fy=null; }));

node.append('circle').attr('r',d=>d.r).attr('fill',nodeColor);
node.append('text').text(d=>d.name).attr('x',d=>d.r+3).attr('y',3)
  .attr('font-size',d=>d.type==='movement'?'12px':'9px')
  .attr('font-weight',d=>d.type==='movement'?'600':'400')
  .attr('fill','#333');

const simulation = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d=>d.id).distance(d=>d.type==='belong'?80:120).strength(0.3))
  .force('charge', d3.forceManyBody().strength(-80))
  .force('center', d3.forceCenter(width/2, height/2))
  .force('collide', d3.forceCollide(d=>d.r+3));

simulation.on('tick',()=>{
  link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  node.attr('transform',d=>`translate(${d.x},${d.y})`);
});

// Tooltip / Highlight
const tip = document.getElementById('tip');
function showTooltip(e,d){
  let html='';
  if(d.type==='movement'){
    const cnt = wm.filter(w=>w.movement_id===d.id).length;
    html = `<h4>◆ ${d.name}</h4>
      <div class="meta">文学流派 · ${cnt} 位获奖作家</div>`;
    if(d._rec && d._rec.era) html += `<div style="color:#666;font-size:11px;margin-top:4px;">时代：${d._rec.era}</div>`;
  } else {
    const w = d._rec;
    const myMoves = (writerMoves[d.id]||[]).map(mid=>movements.find(m=>m.movement_id===mid)?.name_zh).filter(Boolean);
    const myGenres = (writerGenres[d.id]||[]).map(gid=>genres.find(g=>g.genre_id===gid)?.name_zh).filter(Boolean);
    html = `<h4>${w.name_en}${w.name_native?' <span style="color:#666;">'+w.name_native+'</span>':''}</h4>
      <div class="meta">🏆 ${w.nobel_year} · ${w.country}${w.gender==='female'?' · 女作家':''}</div>`;
    if(myMoves.length) html += `<div style="margin-top:4px;">${myMoves.map(m=>`<span class="tag tag-move">${m}</span>`).join('')}</div>`;
    if(myGenres.length) html += `<div>${myGenres.map(g=>`<span class="tag tag-genre">${g}</span>`).join('')}</div>`;
  }
  tip.innerHTML = html;
  tip.style.display='block';
  const x = Math.min(e.clientX+16, window.innerWidth-320);
  const y = Math.min(e.clientY+16, window.innerHeight-tip.offsetHeight-20);
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
function hideTooltip(){ tip.style.display='none'; }

function highlightChain(d){
  const relIds = new Set([d.id]);
  const relatedLinks = new Set();
  links.forEach((l,i)=>{
    const sid = l.source.id||l.source, tid = l.target.id||l.target;
    if(sid===d.id || tid===d.id){
      relatedLinks.add(i);
      relIds.add(sid); relIds.add(tid);
    }
  });
  node.classed('dim',n=>!relIds.has(n.id));
  link.classed('dim',(l,i)=>!relatedLinks.has(i)).classed('active',(l,i)=>relatedLinks.has(i));
}
function resetHighlight(){
  node.classed('dim',false);
  link.classed('dim',false).classed('active',false);
}
node.on('mouseover',showTooltip).on('mouseout',hideTooltip).on('click',(e,d)=>{ e.stopPropagation(); highlightChain(d); });

// 控件
document.getElementById('litColorMode').onchange = ()=>{
  node.select('circle').transition().duration(300).attr('fill',nodeColor);
};
document.getElementById('litReset').onclick = resetHighlight;

// 图层 + 筛选
function applyFilters(){
  const showMove = document.getElementById('litShowMove').checked;
  const showWriter = document.getElementById('litShowWriter').checked;
  const showBelong = document.getElementById('litShowBelong').checked;
  const showInfl = document.getElementById('litShowInfluence').checked;
  const mf = document.getElementById('litMoveFilter').value;
  const gf = document.getElementById('litGenreFilter').value;
  const gdf = document.getElementById('litGenderFilter').value;
  const minY = +document.getElementById('litYearRange').value;

  node.style('display',d=>{
    if(d.type==='movement'){
      if(!showMove) return 'none';
      if(mf && d.id!==mf) return 'none';
      return null;
    }
    if(!showWriter) return 'none';
    const w = d._rec;
    if(w.nobel_year < minY) return 'none';
    if(gdf && w.gender!==gdf) return 'none';
    if(mf){
      const my = writerMoves[d.id]||[];
      if(!my.includes(mf)) return 'none';
    }
    if(gf){
      const my = writerGenres[d.id]||[];
      if(!my.includes(gf)) return 'none';
    }
    return null;
  });
  const visible = new Set();
  node.each(function(d){ if(d3.select(this).style('display')!=='none') visible.add(d.id); });
  link.style('display',l=>{
    const sid=l.source.id||l.source, tid=l.target.id||l.target;
    if(!visible.has(sid)||!visible.has(tid)) return 'none';
    if(l.type==='belong' && !showBelong) return 'none';
    if(l.type==='influence' && !showInfl) return 'none';
    return null;
  });
}
['litShowMove','litShowWriter','litShowBelong','litShowInfluence','litMoveFilter','litGenreFilter','litGenderFilter'].forEach(id=>{
  document.getElementById(id).onchange = applyFilters;
});
document.getElementById('litYearRange').oninput = (e)=>{
  document.getElementById('litYearLabel').textContent = e.target.value;
  applyFilters();
};

// 填充筛选下拉
const mfSel = document.getElementById('litMoveFilter');
movements.forEach(m=>{
  const o = document.createElement('option'); o.value=m.movement_id; o.textContent=m.name_zh; mfSel.appendChild(o);
});
const gfSel = document.getElementById('litGenreFilter');
genres.forEach(g=>{
  const o = document.createElement('option'); o.value=g.genre_id; o.textContent=g.name_zh; gfSel.appendChild(o);
});

// 名录点击 → 联动网络图
const listItems = document.querySelectorAll('.writer-item');
listItems.forEach((item,idx)=>{
  const w = writers[idx];
  item.onclick = ()=>{
    listItems.forEach(x=>x.classList.remove('active'));
    item.classList.add('active');
    svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity);
    setTimeout(()=>{
      const target = nodes.find(n=>n.id===w.writer_id);
      if(target){
        highlightChain(target);
        const scale = 1.6;
        const tx = width/2 - target.x*scale;
        const ty = height/2 - target.y*scale;
        svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity.translate(tx,ty).scale(scale));
      }
    }, 100);
  };
});
</script>
</body>
</html>
