<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>诺贝尔和平奖 · 领域与组织图谱</title>
<script src="../lib/vendors/d3.v7.min.js"></script>
<script src="../lib/vendors/echarts.min.js"></script>
<link rel="stylesheet" href="../css/style.css">
<style>
:root { --peace-bg: #eef3f7; --peace-accent: #1e5799; --peace-secondary: #2989d8; --peace-olive: #6B8E23; }
body { background: var(--peace-bg); margin: 0; font-family: -apple-system, system-ui, sans-serif; }
.header { background: linear-gradient(135deg, #1e5799 0%, #2989d8 50%, #7db9e8 100%); color: white; padding: 2rem 3rem; }
.header h1 { margin: 0; font-size: 2rem; }
.header p { margin: 0.5rem 0 0; opacity: 0.9; }
.container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
.loading { text-align: center; padding: 4rem; color: #666; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
.card { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
.card h3 { margin: 0 0 1rem; color: var(--peace-accent); font-size: 1.1rem; border-left: 4px solid var(--peace-accent); padding-left: 0.75rem; }
.chart { width: 100%; height: 380px; }
.chart-wide { width: 100%; height: 500px; }
.stats-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
.stat-card { background: white; border-radius: 12px; padding: 1.25rem; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
.stat-num { font-size: 2.2rem; font-weight: 700; color: var(--peace-accent); }
.stat-label { color: #666; font-size: 0.85rem; margin-top: 0.3rem; }
.special-note { background: #fff8e1; border-left: 4px solid #ffc107; padding: 0.75rem 1rem; margin: 0.5rem 0; border-radius: 0 6px 6px 0; font-size: 0.9rem; }
.subject-list { max-height: 500px; overflow-y: auto; }
.subject-item { padding: 0.75rem; border-bottom: 1px solid #eef3f7; cursor: pointer; transition: background 0.2s; }
.subject-item:hover { background: #f0f7fd; }
.subject-item.active { background: #e3f2fd; border-left: 3px solid var(--peace-accent); }
.subject-year { color: var(--peace-secondary); font-size: 0.85rem; font-weight: 600; }
.subject-name { font-weight: 500; margin: 0.2rem 0; }
.subject-type { display: inline-block; background: #e3f2fd; color: var(--peace-accent); padding: 0.15rem 0.5rem; border-radius: 10px; font-size: 0.75rem; margin-right: 0.5rem; }
.subject-tag { display: inline-block; background: #f1f8e9; color: var(--peace-olive); padding: 0.15rem 0.5rem; border-radius: 10px; font-size: 0.75rem; margin-right: 0.3rem; margin-top: 0.3rem; }
.full { grid-column: 1 / -1; }
.back-link { position: fixed; top: 1rem; left: 1rem; background: rgba(255,255,255,0.95); padding: 0.5rem 1rem; border-radius: 20px; text-decoration: none; color: var(--peace-accent); box-shadow: 0 2px 8px rgba(0,0,0,0.1); z-index: 100; }
.back-link:hover { background: white; }
.badge { display: inline-block; padding: 0.1rem 0.4rem; border-radius: 4px; font-size: 0.7rem; color: white; margin-left: 0.3rem; }
.badge-decline { background: #f44336; }
.badge-posthumous { background: #9c27b0; }
.badge-in-office { background: #ff9800; }
/* 交互控件 */
.net-toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:8px; font-size:12px; }
.net-toolbar label { display:flex; align-items:center; gap:4px; color:#334; cursor:pointer; }
.net-toolbar select, .net-toolbar input[type="range"] { font-size:12px; padding:2px 4px; border:1px solid #cbd5e1; border-radius:4px; }
.net-toolbar .reset-btn { padding:4px 10px; background:#1e5799; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:12px; }
.net-toolbar .reset-btn:hover { background:#0d3a66; }
.net-hint { font-size:11px; color:#888; margin-left:auto; }
.tooltip-net { position:fixed; background:rgba(255,255,255,0.98); border:1px solid var(--peace-accent); border-radius:8px; padding:10px 12px; max-width:280px; font-size:12px; pointer-events:none; z-index:200; box-shadow:0 4px 16px rgba(30,87,153,0.2); display:none; }
.tooltip-net h4 { font-size:13px; color:var(--peace-accent); margin:0 0 4px; }
.tooltip-net .meta { color:#666; font-size:11px; margin-bottom:6px; }
.tooltip-net .field { color:var(--peace-olive); font-size:11px; }
.tooltip-net .field-tag { display:inline-block; background:#f1f8e9; color:var(--peace-olive); padding:1px 6px; border-radius:8px; font-size:11px; margin:1px; }
#chart_network { background:#fff; border-radius:8px; }
.net-node circle { cursor:pointer; stroke:#fff; stroke-width:1.5px; transition:all .2s; }
.net-node:hover circle { stroke:#ffc107; stroke-width:2.5px; filter:drop-shadow(0 0 6px #ffc107); }
.net-node text { font-size:9px; fill:#333; pointer-events:none; text-shadow:0 1px 2px rgba(255,255,255,.9); }
.net-node.dim { opacity:.15; }
.net-link { stroke-opacity:.4; fill:none; transition:all .2s; }
.net-link.dim { opacity:.05; }
.net-link.active { stroke:#ffc107 !important; stroke-opacity:1 !important; stroke-width:2.5px !important; }
</style>
</head>
<body>
<a href="../index.html" class="back-link">← 返回主页</a>
<div class="tooltip-net" id="tip"></div>
<div class="header">
  <h1>☮️ 诺贝尔和平奖 · 领域与组织图谱</h1>
  <p>1901-2026 · 141位获奖主体（个人/组织） · 人道、人权、裁军、环保等7大领域</p>
</div>
<div class="container">
  <div class="loading" id="loading">正在加载本体数据…</div>
  <div id="content" style="display:none">
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num" id="s1">0</div><div class="stat-label">获奖主体总数</div></div>
      <div class="stat-card"><div class="stat-num" id="s2">0</div><div class="stat-label">个人</div></div>
      <div class="stat-card"><div class="stat-num" id="s3">0</div><div class="stat-label">组织</div></div>
      <div class="stat-card"><div class="stat-num" id="s4">0</div><div class="stat-label">覆盖领域</div></div>
      <div class="stat-card"><div class="stat-num" id="s5">0</div><div class="stat-label">国家/地区</div></div>
    </div>
    <div class="grid">
      <div class="card">
        <h3>📈 历年获奖趋势</h3>
        <div id="chart_year" class="chart-wide"></div>
      </div>
    </div>
    <div class="grid">
      <div class="card">
        <h3>🌍 领域分布</h3>
        <div id="chart_field" class="chart"></div>
      </div>
      <div class="card">
        <h3>🏛️ 个人 vs 组织获奖比例</h3>
        <div id="chart_type" class="chart"></div>
      </div>
    </div>
    <div class="grid">
      <div class="card full">
        <h3>🕸️ 主体-领域关系网络</h3>
        <div class="net-toolbar">
          <label><input type="checkbox" id="netShowPerson" checked> 个人</label>
          <label><input type="checkbox" id="netShowOrg" checked> 组织</label>
          <label><input type="checkbox" id="netShowField" checked> 领域</label>
          <select id="netColorMode">
            <option value="type">按类型着色</option>
            <option value="field">按领域着色</option>
            <option value="decade">按年代着色</option>
          </select>
          <select id="netFieldFilter"><option value="">全部领域</option></select>
          <label style="display:flex;align-items:center;gap:4px;">年份≥<input type="range" id="netYearRange" min="1901" max="2020" step="5" value="1901" style="width:100px;"> <span id="netYearLabel" style="font-weight:600;">1901</span></label>
          <button class="reset-btn" id="netReset">清除高亮</button>
          <span class="net-hint">滚轮缩放 · 拖拽节点 · 点击高亮链路 · 双击重置</span>
        </div>
        <svg id="chart_network" width="100%" height="550"></svg>
      </div>
    </div>
    <div class="grid">
      <div class="card">
        <h3>🌐 获奖国家分布</h3>
        <div id="chart_country" class="chart"></div>
      </div>
      <div class="card">
        <h3>📋 获奖主体名录（含特殊案例）</h3>
        <div class="subject-list" id="subject_list"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import * as db from '../js/db.js';
const log = msg => document.getElementById('loading').textContent = msg;

await db.initDB(log);
log('正在查询和平奖数据…');

const subjects = (await db.query('SELECT * FROM peace_subjects ORDER BY nobel_year')).rows;
const orgs = (await db.query('SELECT * FROM peace_orgs')).rows;
const fields = (await db.query('SELECT * FROM peace_fields')).rows;
const sf = (await db.query('SELECT * FROM peace_field_rel')).rows;

const personSubjects = subjects.filter(s=>s.subject_type==='个人');
const orgSubjects = subjects.filter(s=>s.subject_type==='组织');
const countries = new Set(subjects.map(s=>s.country).filter(Boolean));

document.getElementById('s1').textContent = subjects.length;
document.getElementById('s2').textContent = personSubjects.length;
document.getElementById('s3').textContent = orgSubjects.length;
document.getElementById('s4').textContent = fields.length;
document.getElementById('s5').textContent = countries.size;

document.getElementById('loading').style.display = 'none';
document.getElementById('content').style.display = 'block';

// 名录
const sl = document.getElementById('subject_list');
subjects.forEach(s => {
  const div = document.createElement('div');
  div.className = 'subject-item';
  const fieldRel = sf.filter(r=>r.subject_id===s.subject_id).map(r=>fields.find(f=>f.field_id===r.field_id)?.name_zh).filter(Boolean);
  let badges = '';
  if(s.declined === '是') badges += '<span class="badge badge-decline">拒领</span>';
  if(s.posthumous === '是') badges += '<span class="badge badge-posthumous">追授</span>';
  if(s.in_office === '是') badges += '<span class="badge badge-in-office">在任时获奖</span>';
  div.innerHTML = `
    <div class="subject-year">${s.nobel_year}年 ${badges}</div>
    <div class="subject-name">
      <span class="subject-type">${s.subject_type}</span>
      ${s.name_en}${s.acronym?'（'+s.acronym+'）':''}
    </div>
    <div>${s.country||'国际组织'}</div>
    <div>${fieldRel.map(f=>`<span class="subject-tag">${f}</span>`).join('')}</div>
  `;
  sl.appendChild(div);
});

// 领域分布
const fieldCount = {};
sf.forEach(r=>{ const f = fields.find(x=>x.field_id===r.field_id); if(f) fieldCount[f.name_zh]=(fieldCount[f.name_zh]||0)+1; });
const fieldData = Object.entries(fieldCount).map(([k,v])=>({name:k,value:v})).sort((a,b)=>b.value-a.value);
echarts.init(document.getElementById('chart_field')).setOption({
  tooltip:{trigger:'item'},
  series:[{type:'pie',radius:'70%',data:fieldData,label:{formatter:'{b}: {c}'},
    itemStyle:{borderRadius:6,borderColor:'#fff',borderWidth:2},
    color:['#1e5799','#2989d8','#7db9e8','#6B8E23','#95a5a6','#e67e22','#9b59b6']}]
});

// 个人/组织比例
echarts.init(document.getElementById('chart_type')).setOption({
  tooltip:{trigger:'item'},
  series:[{type:'pie',radius:['40%','70%'],data:[
    {name:'个人',value:personSubjects.length,itemStyle:{color:'#2989d8'}},
    {name:'组织',value:orgSubjects.length,itemStyle:{color:'#6B8E23'}}
  ],label:{formatter:'{b}: {c}人'},itemStyle:{borderRadius:6,borderColor:'#fff',borderWidth:2}}]
});

// 国家分布
const countryCount = {};
subjects.forEach(s=>{ if(s.country) countryCount[s.country]=(countryCount[s.country]||0)+1; });
const countryData = Object.entries(countryCount).map(([k,v])=>({name:k,value:v})).sort((a,b)=>b.value-a.value).slice(0,12);
echarts.init(document.getElementById('chart_country')).setOption({
  tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},
  grid:{left:80,right:20,top:10,bottom:20},
  xAxis:{type:'value'},yAxis:{type:'category',data:countryData.map(d=>d.name).reverse()},
  series:[{type:'bar',data:countryData.map(d=>d.value).reverse(),itemStyle:{color:'#2989d8',borderRadius:[0,6,6,0]}}]
});

// 历年趋势
const yearMin = 1901, yearMax = 2026;
const years = []; for(let y=yearMin;y<=yearMax;y++) years.push(y);
const yearPerson = years.map(y=>subjects.filter(s=>s.nobel_year===y && s.subject_type==='个人').length);
const yearOrg = years.map(y=>subjects.filter(s=>s.nobel_year===y && s.subject_type==='组织').length);
echarts.init(document.getElementById('chart_year')).setOption({
  tooltip:{trigger:'axis'}, legend:{data:['个人','组织'],bottom:0},
  grid:{left:40,right:20,top:20,bottom:50},
  xAxis:{type:'category',data:years},yAxis:{type:'value'},
  series:[
    {name:'个人',type:'bar',stack:'total',data:yearPerson,itemStyle:{color:'#2989d8'}},
    {name:'组织',type:'bar',stack:'total',data:yearOrg,itemStyle:{color:'#6B8E23'}}
  ]
});

// 领域关系网络（带缩放/tooltip/高亮/筛选）
const svg = d3.select('#chart_network');
const width = svg.node().getBoundingClientRect().width;
const height = 550;
svg.attr('viewBox',`0 0 ${width} ${height}`);

// 领域色板
const fieldColors = {};
fields.forEach((f,i)=>{ fieldColors[f.field_id] = ['#1e5799','#2989d8','#6B8E23','#e67e22','#9b59b6','#0d9488','#d946ef','#dc2626'][i%8]; });

// 主体到领域映射
const subjectFields = {};
sf.forEach(r=>{ if(!subjectFields[r.subject_id]) subjectFields[r.subject_id]=[]; subjectFields[r.subject_id].push(r.field_id); });

// 节点数据（保存原始 subject 记录，便于 tooltip）
const networkNodes = [
  ...fields.map(f=>({id:f.field_id,name:f.name_zh,type:'field',r: 22 + sf.filter(r=>r.field_id===f.field_id).length*1.2,_rec:f})),
  ...subjects.map(s=>({
    id:s.subject_id,
    name: s.subject_type==='组织' ? (s.acronym||s.name_en.slice(0,10)) : s.name_en.split(' ').slice(-1)[0],
    type:s.subject_type,
    r: s.subject_type==='组织'?10:6,
    _rec:s
  }))
];
const networkLinks = sf.map(r=>({source:r.subject_id,target:r.field_id})).filter(l=>networkNodes.find(n=>n.id===l.source)&&networkNodes.find(n=>n.id===l.target));

function nodeColor(d){
  const mode = document.getElementById('netColorMode').value;
  if(mode==='field'){
    if(d.type==='field') return fieldColors[d.id]||'#1e5799';
    const first = subjectFields[d.id]&&subjectFields[d.id][0];
    return first ? fieldColors[first] : '#94a3b8';
  }
  if(mode==='decade'){
    const y = d._rec && d._rec.nobel_year;
    if(!y) return '#1e5799'; // 领域节点
    const decade = Math.floor(y/10)*10;
    const decadeColor = {1900:'#4a5568',1910:'#805ad5',1920:'#2b6cb0',1930:'#c05621',1940:'#dd6b20',1950:'#38a169',1960:'#2f855a',1970:'#b7791f',1980:'#9b2c2c',1990:'#319795',2000:'#553c9a',2010:'#2c5282'};
    return decadeColor[decade] || '#64748b';
  }
  // type
  if(d.type==='field') return '#1e5799';
  if(d.type==='组织') return '#6B8E23';
  return '#7db9e8';
}

const zoom = d3.zoom().scaleExtent([0.2,4]).on('zoom',e=>{
  g.attr('transform',e.transform);
});
svg.call(zoom).on('dblclick.zoom',null);
svg.on('dblclick',()=>{ svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity); resetHighlight(); });

const g = svg.append('g');
const link = g.append('g').selectAll('line').data(networkLinks).join('line')
  .attr('class','net-link')
  .attr('stroke',d=>{
    const f = fields.find(x=>x.field_id===(d.target.id||d.target));
    return f ? (fieldColors[d.target.id||d.target]||'#1e5799') : '#1e5799';
  })
  .attr('stroke-opacity',0.35)
  .attr('stroke-width',1);

const node = g.append('g').selectAll('g').data(networkNodes).join('g')
  .attr('class','net-node')
  .call(d3.drag()
    .on('start',(e,d)=>{if(!e.active) simulation.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y;})
    .on('drag',(e,d)=>{ d.fx=e.x; d.fy=e.y; })
    .on('end',(e,d)=>{ if(!e.active) simulation.alphaTarget(0); d.fx=null; d.fy=null; }));

node.append('circle').attr('r',d=>d.r).attr('fill',nodeColor);
node.append('text').text(d=>d.name).attr('x',d=>d.r+3).attr('y',3)
  .attr('font-size',d=>d.type==='field'?'12px':'9px')
  .attr('font-weight',d=>d.type==='field'?'600':'400')
  .attr('fill','#333');

const simulation = d3.forceSimulation(networkNodes)
  .force('link',d3.forceLink(networkLinks).id(d=>d.id).distance(100).strength(0.3))
  .force('charge',d3.forceManyBody().strength(-50))
  .force('center',d3.forceCenter(width/2,height/2))
  .force('collide',d3.forceCollide(d=>d.r+3));

simulation.on('tick',()=>{
  link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  node.attr('transform',d=>`translate(${d.x},${d.y})`);
});

// 交互：tooltip / highlight
const tip = document.getElementById('tip');
function showTooltip(e,d){
  let html='';
  if(d.type==='field'){
    const count = sf.filter(r=>r.field_id===d.id).length;
    html = `<h4>◆ ${d.name}</h4>
      <div class="meta">领域 · ${count} 位获奖主体</div>`;
  } else {
    const s = d._rec;
    const fRel = (subjectFields[d.id]||[]).map(fid=>fields.find(f=>f.field_id===fid)?.name_zh).filter(Boolean);
    html = `<h4>${s.name_en}${s.acronym?' <span style="color:#6B8E23;">'+s.acronym+'</span>':''}</h4>
      <div class="meta">🏆 ${s.nobel_year} · ${s.subject_type} · ${s.country||'国际组织'}</div>`;
    if(fRel.length) html += `<div style="margin-top:4px;">${fRel.map(f=>`<span class="field-tag">${f}</span>`).join('')}</div>`;
  }
  tip.innerHTML = html;
  tip.style.display='block';
  const x = Math.min(e.clientX+16, window.innerWidth-300);
  const y = Math.min(e.clientY+16, window.innerHeight-tip.offsetHeight-20);
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
function hideTooltip(){ tip.style.display='none'; }

function highlightChain(d){
  const relIds = new Set([d.id]);
  const relatedLinks = new Set();
  networkLinks.forEach((l,i)=>{
    const sid = l.source.id||l.source, tid = l.target.id||l.target;
    if(sid===d.id || tid===d.id){
      relatedLinks.add(i);
      relIds.add(sid); relIds.add(tid);
    }
  });
  node.classed('dim',n=>!relIds.has(n.id));
  link.classed('dim',(l,i)=>!relatedLinks.has(i)).classed('active',(l,i)=>relatedLinks.has(i));
}
function resetHighlight(){
  node.classed('dim',false);
  link.classed('dim',false).classed('active',false);
}
node.on('mouseover',showTooltip).on('mouseout',hideTooltip).on('click',(e,d)=>{ e.stopPropagation(); highlightChain(d); });

// 控件
document.getElementById('netColorMode').onchange = ()=>{
  node.select('circle').transition().duration(300).attr('fill',nodeColor);
};
document.getElementById('netReset').onclick = resetHighlight;

// 图层显隐 + 领域筛选 + 年份筛选
function applyFilters(){
  const showPerson = document.getElementById('netShowPerson').checked;
  const showOrg = document.getElementById('netShowOrg').checked;
  const showField = document.getElementById('netShowField').checked;
  const ff = document.getElementById('netFieldFilter').value;
  const minY = +document.getElementById('netYearRange').value;

  node.style('display',d=>{
    if(d.type==='field'){
      if(!showField) return 'none';
      if(ff && d.id!==ff) return 'none';
      return null;
    }
    if(d.type==='个人' && !showPerson) return 'none';
    if(d.type==='组织' && !showOrg) return 'none';
    const y = d._rec && d._rec.nobel_year;
    if(y && y < minY) return 'none';
    if(ff){
      const myFields = subjectFields[d.id]||[];
      if(!myFields.includes(ff)) return 'none';
    }
    return null;
  });
  const visible = new Set();
  node.each(function(d){ if(d3.select(this).style('display')!=='none') visible.add(d.id); });
  link.style('display',l=>{
    const sid=l.source.id||l.source, tid=l.target.id||l.target;
    return (visible.has(sid)&&visible.has(tid)) ? null : 'none';
  });
}
['netShowPerson','netShowOrg','netShowField','netFieldFilter'].forEach(id=>{
  document.getElementById(id).onchange = applyFilters;
});
document.getElementById('netYearRange').oninput = (e)=>{
  document.getElementById('netYearLabel').textContent = e.target.value;
  applyFilters();
};

// 填充领域筛选
const ffSel = document.getElementById('netFieldFilter');
fields.forEach(f=>{
  const o = document.createElement('option');
  o.value = f.field_id; o.textContent = f.name_zh;
  ffSel.appendChild(o);
});

// 名录点击 → 联动网络图高亮
const listItems = document.querySelectorAll('.subject-item');
listItems.forEach((item,idx)=>{
  const s = subjects[idx];
  item.onclick = ()=>{
    listItems.forEach(x=>x.classList.remove('active'));
    item.classList.add('active');
    // 复位缩放
    svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity);
    // 高亮对应节点及其边
    setTimeout(()=>{
      const target = networkNodes.find(n=>n.id===s.subject_id);
      if(target){
        highlightChain(target);
        // 滚动到该节点
        const scale = 1.6;
        const tx = width/2 - target.x*scale;
        const ty = height/2 - target.y*scale;
        svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity.translate(tx,ty).scale(scale));
      }
    }, 100);
  };
});
</script>
</body>
</html>
