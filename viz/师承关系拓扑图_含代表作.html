<style>

body{background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:#e2e8f0;font-family:'Helvetica Neue',-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;overflow:hidden;}

.stats{display:flex;gap:24px;font-size:12px;}
.stat{text-align:center;}
.stat-num{font-size:20px;font-weight:700;color:#60a5fa;}
.stat-label{color:#94a3b8;margin-top:2px;}

.ctrl-item{margin-bottom:10px;font-size:12px;}
.ctrl-item label{display:flex;align-items:center;gap:6px;cursor:pointer;color:#cbd5e1;}
.ctrl-item input{accent-color:#60a5fa;}

.legend{position:fixed;top:80px;right:20px;z-index:90;background:rgba(30,41,59,.9);backdrop-filter:blur(12px);border:1px solid rgba(148,163,184,.2);border-radius:12px;padding:16px;width:200px;}

.node text{font-size:10px;fill:#e2e8f0;text-anchor:middle;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.8);}

<body>
<div class="header">
  <div><div class="title">🏆 诺奖师承关系图谱</div>
  <div class="subtitle">节点可切换按学科/学派着色 · 实线=师承 · 虚线=代表作传承 · 橙色=合作 · 悬停看详情 · 拖拽布局</div></div>
  <div class="stats">

    <div class="stat"><div class="stat-num" id="stW">0</div><div class="stat-label">代表作</div></div>
    <div class="stat"><div class="stat-num" id="stPi">0</div><div class="stat-label">论文传承</div></div>
  </div>
</div>
<div class="controls">
  <h3>图层控制</h3>
  <div class="ctrl-item"><label><input type="checkbox" id="showPeople" checked> 人物节点</label></div>
  <div class="ctrl-item"><label><input type="checkbox" id="showEdge" checked> 师承边</label></div>
  <div class="ctrl-item"><label><input type="checkbox" id="showPaper" checked> 代表作传承（虚线）</label></div>
  <div class="ctrl-item"><label><input type="checkbox" id="showCollab" checked> 合作关系（橙色）</label></div>
  <div class="ctrl-item"><label><input type="checkbox" id="showNobelOnly"> 仅显示诺奖得主</label></div>
  <h3 style="margin-top:14px;">着色</h3>
  <div class="ctrl-item">
    <select id="colorMode" style="width:100%;padding:5px;background:#334155;color:#e2e8f0;border:1px solid #475569;border-radius:6px;font-size:12px;">
      <option value="field">按学科着色</option>
      <option value="school">按学派着色</option>
    </select>
  </div>
  <div class="ctrl-item">
    <select id="schoolFilter" style="width:100%;padding:5px;background:#334155;color:#e2e8f0;border:1px solid #475569;border-radius:6px;font-size:12px;">
      <option value="">全部学派</option>
    </select>
  </div>
  <h3 style="margin-top:14px;">影响力</h3>
  <div class="ctrl-item"><label><input type="checkbox" id="sizeBy" checked> 节点大小=门下诺奖数</label></div>

</div>
<div class="legend">

  <div class="legend-item"><div class="legend-dot" style="background:#4285f4"></div>物理学</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ea4335"></div>化学</div>
  <div class="legend-item"><div class="legend-dot" style="background:#34a853"></div>生理/医学</div>
  <div class="legend-item"><div class="legend-dot" style="background:#b8860b"></div>经济学</div>
  <div class="legend-item"><div class="legend-dot" style="background:#9e9e9e"></div>非诺奖导师</div>
  <h3 style="margin-top:10px;">关系</h3>
  <div class="legend-item"><svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke="#64748b" stroke-width="2"/></svg>师承（博士/博后）</div>

</div>

    nobel_year: p.nobel_year ? String(p.nobel_year) : '',
    nobel_category: p.nobel_category || '',
    gender: '',
    note: wiki ? wiki.desc_zh || '' : '',
    papers: [],
    school: ''
  });
}

// 3) 合并 person_school → 给静态人补充 school
psDB.forEach(ps=>{
  const person = DATA.people.find(p=>p.id===ps.person_id);
  if(person && !person.school){
    const sn = schoolMap[ps.school_id];
    if(sn) person.school = sn;
  }
});

// 4) 合并 mentorship 边
const mentorKey = (s,a)=> s+'_'+a;
const existMentor = new Set(DATA.edges.map(e=>mentorKey(e.s,e.a)));
let dbMentorAdded = 0;
mentorDB.forEach(m=>{
  const key = mentorKey(m.student_id, m.advisor_id);
  if(existMentor.has(key)) return;
  existMentor.add(key);
  enrichFromDB(m.student_id);
  enrichFromDB(m.advisor_id);
  DATA.edges.push({
    s: m.student_id,
    a: m.advisor_id,
    type: m.relation_type || '博士导师',
    year: m.start_year ? String(m.start_year) : '',
    verified: 'DB补充'
  });
  dbMentorAdded++;
});

// 5) 合并 collaboration 边
const collabKey = (s,t)=> s+'_'+t;
const existCollab = new Set(DATA.cedges.map(e=>collabKey(e.source,e.target)));
let dbCollabAdded = 0;
collabDB.forEach(c=>{
  const key1 = collabKey(c.person_a_id, c.person_b_id);
  const key2 = collabKey(c.person_b_id, c.person_a_id);
  if(existCollab.has(key1)||existCollab.has(key2)) return;
  existCollab.add(key1);
  enrichFromDB(c.person_a_id);
  enrichFromDB(c.person_b_id);
  DATA.cedges.push({
    source: c.person_a_id,
    target: c.person_b_id,
    label: '合作',
    rtype: '合作',
    topic: c.topic || '',
    year: '',
    pub: c.publication || ''
  });
  dbCollabAdded++;
});

// 6) 更新统计
DATA.stats.persons = DATA.people.length;
DATA.stats.edges = DATA.edges.length;
DATA.stats.collab = DATA.cedges.length;
// 统计新增的学派名称（补充到 schools 数组）
DATA.people.forEach(p=>{
  if(p.school && !DATA.schools.includes(p.school)) DATA.schools.push(p.school);
});

// 7) 填充统计显示
document.getElementById("stP").textContent = DATA.people.length;
document.getElementById("stE").textContent = DATA.edges.length;
document.getElementById("stW").textContent = DATA.stats.papers;
document.getElementById("stPi").textContent = DATA.paper_inh.length;

const width = window.innerWidth, height = window.innerHeight - 70;
const svg = d3.select("#graph").attr("width",width).attr("height",height);
const g = svg.append("g");
svg.call(d3.zoom().scaleExtent([.2,4]).on("zoom",(e)=>g.attr("transform",e.transform)));

// 计算每个导师门下诺奖学生数（用于节点大小）
const nobelCount={};
DATA.edges.forEach(e=>{
  const s=DATA.people.find(p=>p.id===e.s);
  if(s&&s.nobel_year&&s.nobel_year.trim()!==''){
    nobelCount[e.a]=(nobelCount[e.a]||0)+1;
  }
});

// 准备节点&边
const idSet = new Set();
const nodes = DATA.people.filter(p=>{
  if(document.getElementById("showNobelOnly").checked) return p.nobel_year&&p.nobel_year.trim()!=='';
  return true;
}).map(p=>({...p,r:14+Math.log2((nobelCount[p.id]||1)+1)*6}));
const nodeIds = new Set(nodes.map(n=>n.id));
const edges = DATA.edges.filter(e=>nodeIds.has(e.s)&&nodeIds.has(e.a)).map(e=>({...e,source:e.s,target:e.a,kind:"mentor"}));
const paperLinks = DATA.paper_inh.filter(e=>nodeIds.has(e.s)&&nodeIds.has(e.a)&&e.s!==e.a).map(e=>({...e,source:e.s,target:e.a,kind:"paper"}));
const collabLinks = DATA.cedges.filter(e=>nodeIds.has(e.source)&&nodeIds.has(e.target)).map(e=>({...e,kind:"collab"}));

const allLinks=[...edges,...paperLinks,...collabLinks];

// force simulation
const sim = d3.forceSimulation(nodes)
  .force("link",d3.forceLink(allLinks).id(d=>d.id).distance(d=>d.kind==="paper"?120:100).strength(.5))
  .force("charge",d3.forceManyBody().strength(-420))
  .force("center",d3.forceCenter(width/2,height/2))
  .force("collide",d3.forceCollide(d=>d.r+6));

// 渲染边（师承+论文传承）
const linkM = g.append("g").selectAll("line.mentor")
  .data(edges).join("line")
  .attr("class","link")
  .attr("stroke",d=>{
    const map={"博士导师":"#60a5fa","博士后导师":"#38bdf8","研究导师":"#818cf8","家族学术传承":"#f472b6"};
    return map[d.type]||"#64748b";
  })
  .attr("stroke-width",1.8);

const linkP = g.append("g").selectAll("line.paper")
  .data(paperLinks).join("line")
  .attr("class","link paper")
  .attr("stroke","#c084fc")
  .attr("stroke-width",1.2);

// 合作关系边（橙色虚线）
const linkC = g.append("g").selectAll("line.collab")
  .data(collabLinks).join("line")
  .attr("class","link")
  .attr("stroke","#f97316")
  .attr("stroke-width",1.5)
  .attr("stroke-dasharray","6 3");

// 节点
const node = g.append("g").selectAll(".node")
  .data(nodes).join("g")
  .attr("class","node")
  .call(d3.drag()
    .on("start",(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y;})
    .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y;})
    .on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));

node.append("circle")
  .attr("r",d=>document.getElementById("sizeBy").checked?d.r:10)
  .attr("fill",d=>getNodeColor(d))
  .on("mouseover",(e,d)=>showTooltip(e,d))
  .on("mouseout",hideTooltip)
  .on("click",(e,d)=>highlightChain(d));

node.append("text")
  .attr("dy",d=>d.r+12)
  .text(d=>d.name.length>6?d.name.slice(0,5)+"…":d.name);

sim.on("tick",()=>{
  linkM.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  linkP.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  linkC.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  node.attr("transform",d=>`translate(${d.x},${d.y})`);
});

// 交互
const tip = document.getElementById("tip");
function showTooltip(e,d){
  let html=`<h4>${d.name} <span style="color:#94a3b8;font-weight:400;font-size:12px">${d.name_en||''}</span></h4>
    <div class="meta">${d.birth||'?'}–${d.death||''} ｜ ${d.nationality||''}`;
  if(d.nobel_year&&d.nobel_year.trim()){
    html+=` ｜ <span style="color:#fbbf24">🏆${d.nobel_year}年${d.nobel_category}</span>`;
  }
  if(d.school){
    const sc = DATA.school_color[d.school]||'#94a3b8';
    html+=` ｜ <span style="color:${sc}">◆ ${d.school}</span>`;
  }
  html+=`</div>`;
  if(d.papers&&d.papers.length){
    html+=`<div class="section"><div class="section-title">代表作（${d.papers.length}篇）</div>`;
    d.papers.slice(0,3).forEach(w=>{
      html+=`<div class="paper"><span class="paper-year">[${w.year}]</span>${w.title}<br><span style="color:#94a3b8;font-size:10px">${w.contrib.slice(0,60)}${w.contrib.length>60?'…':''}</span></div>`;
    });
    html+=`</div>`;
  }
  // 师承学生
  const students = edges.filter(e=>e.a===d.id).map(e=>nodes.find(n=>n.id===e.s)).filter(Boolean);
  const advisors = edges.filter(e=>e.s===d.id).map(e=>nodes.find(n=>n.id===e.a)).filter(Boolean);
  if(advisors.length) html+=`<div class="section"><div class="section-title">导师</div><span>${advisors.map(a=>a.name).join('、')}</span></div>`;
  if(students.length) html+=`<div class="section"><div class="section-title">学生（${students.length}）</div><span>${students.slice(0,8).map(a=>a.name).join('、')}${students.length>8?'…':''}</span></div>`;
  tip.innerHTML=html;
  tip.style.display="block";
  const x=Math.min(e.clientX+16,window.innerWidth-380), y=Math.min(e.clientY+16,window.innerHeight-tip.offsetHeight-20);
  tip.style.left=x+"px"; tip.style.top=y+"px";
}
function hideTooltip(){tip.style.display="none";}

function highlightChain(d){
  // 高亮所有与该人物相连的师承+论文传承边
  const relIds=new Set([d.id]);
  const relatedLinks = new Set();
  [...edges,...paperLinks].forEach((l,i)=>{
    if(l.source.id===d.id||l.target.id===d.id||l.source===d.id||l.target===d.id){
      relatedLinks.add(i);
      const sid=l.source.id||l.source, tid=l.target.id||l.target;
      relIds.add(sid); relIds.add(tid);
    }
  });
  node.classed("dim",n=>!relIds.has(n.id));
  linkM.classed("dim",(l,i)=>!relatedLinks.has(i)).classed("active",(l,i)=>relatedLinks.has(i));
  linkP.classed("dim",(l,i)=>!relatedLinks.has(edges.length+i)).classed("active",(l,i)=>relatedLinks.has(edges.length+i));
}
function resetHighlight(){
  node.classed("dim",false);
  linkM.classed("dim",false).classed("active",false);
  linkP.classed("dim",false).classed("active",false);
}

// 控件 —— 统一可见性函数，避免多个 onchange 互相覆盖
function applyVisibility(){
  const sv = schoolSel.value;
  const nobelOnly = document.getElementById("showNobelOnly").checked;
  const peopleOn = document.getElementById("showPeople").checked;

  // 学派筛选：选中某学派时，保留「该学派成员 + 直接邻居（导师/学生）」，
  // 并把非学派的邻居加 dim 类作为上下文；这样筛选后节点不会全部孤立。
  let schoolNeighbours = null;
  if(sv){
    schoolNeighbours = new Set();
    DATA.people.forEach(p=>{ if(p.school===sv) schoolNeighbours.add(p.id); });
    edges.forEach(e=>{
      const sid=e.source.id||e.source, tid=e.target.id||e.target;
      if(schoolNeighbours.has(sid)) schoolNeighbours.add(tid);
      if(schoolNeighbours.has(tid)) schoolNeighbours.add(sid);
    });
  }

  node.style("display", d=>{
    if(!peopleOn) return "none";
    if(sv && !schoolNeighbours.has(d.id)) return "none";
    if(nobelOnly && (!d.nobel_year||d.nobel_year.trim()==="")) return "none";
    return null;
  });
  // 学派筛选模式：非该学派的节点做半透明处理（保留邻居作为上下文）
  // 无学派筛选时不动 dim 类，避免和 highlightChain 的高亮状态冲突
  if(sv) node.classed("dim", d=> d.school!==sv);

  // 边跟着节点过滤
  const visibleIds = new Set();
  node.each(function(d){ if(d3.select(this).style("display")!=="none") visibleIds.add(d.id); });
  const edgeVis = l=>visibleIds.has(l.source.id||l.source)&&visibleIds.has(l.target.id||l.target)?null:"none";
  linkM.style("display", edgeVis);
  linkP.style("display", edgeVis);
  linkC.style("display", edgeVis);
}

// 图层类控件
document.getElementById("showEdge").onchange=e=>linkM.style("display",e.target.checked?null:"none");
document.getElementById("showPaper").onchange=e=>linkP.style("display",e.target.checked?null:"none");
document.getElementById("showCollab").onchange=e=>linkC.style("display",e.target.checked?null:"none");

// 节点大小
document.getElementById("sizeBy").onchange=()=>{
  node.select("circle").transition().attr("r",d=>document.getElementById("sizeBy").checked?d.r:10);
  node.select("text").transition().attr("dy",d=>(document.getElementById("sizeBy").checked?d.r:10)+12);
};

// 学派筛选下拉
const schoolSel = document.getElementById("schoolFilter");
DATA.schools.forEach(s=>{
  const o = document.createElement("option");
  o.value = s; o.textContent = s;
  schoolSel.appendChild(o);
});

// 着色模式
function getNodeColor(d){
  const mode = document.getElementById("colorMode").value;
  if(mode==="school"){
    return DATA.school_color[d.school]||"#9e9e9e";
  }
  if(!d.nobel_year||d.nobel_year.trim()==='') return "#9e9e9e";
  return DATA.field_color[d.nobel_category]||"#fbbf24";
}

function applyColorMode(){
  node.select("circle").transition().duration(300).attr("fill",d=>getNodeColor(d));
  updateLegend();
}

function updateLegend(){
  const mode = document.getElementById("colorMode").value;
  const legend = document.querySelector(".legend");
  if(mode==="school"){
    legend.innerHTML = '<h3>学派</h3>' +
      DATA.schools.map(s=>`<div class="legend-item"><div class="legend-dot" style="background:${DATA.school_color[s]||'#94a3b8'}"></div>${s}</div>`).join('') +
      '<div class="legend-item"><div class="legend-dot" style="background:#9e9e9e"></div>无学派</div>' +
      '<h3 style="margin-top:10px;">关系</h3>' +
      '<div class="legend-item"><svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke="#64748b" stroke-width="2"/></svg>师承</div>' +
      '<div class="legend-item"><svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 2"/></svg>代表作传承</div>' +
      '<div class="legend-item"><svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke="#f97316" stroke-width="2" stroke-dasharray="6 3"/></svg>合作关系</div>';
  } else {
    legend.innerHTML = '<h3>学科</h3>' +
      '<div class="legend-item"><div class="legend-dot" style="background:#4285f4"></div>物理学</div>' +
      '<div class="legend-item"><div class="legend-dot" style="background:#ea4335"></div>化学</div>' +
      '<div class="legend-item"><div class="legend-dot" style="background:#34a853"></div>生理/医学</div>' +
      '<div class="legend-item"><div class="legend-dot" style="background:#b8860b"></div>经济学</div>' +
      '<div class="legend-item"><div class="legend-dot" style="background:#9e9e9e"></div>非诺奖导师</div>' +
      '<h3 style="margin-top:10px;">关系</h3>' +
      '<div class="legend-item"><svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke="#64748b" stroke-width="2"/></svg>师承（博士/博后）</div>' +
      '<div class="legend-item"><svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 2"/></svg>代表作传承</div>' +
      '<div class="legend-item"><svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke="#f97316" stroke-width="2" stroke-dasharray="6 3"/></svg>合作关系</div>';
  }
}

document.getElementById("colorMode").onchange = applyColorMode;
document.getElementById("showPeople").onchange = applyVisibility;
document.getElementById("showNobelOnly").onchange = applyVisibility;
schoolSel.onchange = applyVisibility;

// 高亮也覆盖合作边
const _origHighlight = highlightChain;
highlightChain = function(d){
  _origHighlight(d);
  linkC.classed("dim", l=>{
    const sid=l.source.id||l.source, tid=l.target.id||l.target;
    return !(sid===d.id||tid===d.id);
  }).classed("active", l=>{
    const sid=l.source.id||l.source, tid=l.target.id||l.target;
    return sid===d.id||tid===d.id;
  });
};
const _origReset = resetHighlight;
resetHighlight = function(){
  _origReset();
  linkC.classed("dim",false).classed("active",false);
};
</script>
</body>
