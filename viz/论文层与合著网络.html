  xAxis:{type:"value",min:1884,max:2028,name:"年份",axisLabel:{fontSize:11}},

// 表格
const tb=document.querySelector("#tbl tbody");
const qEl=document.getElementById("q"), dEl=document.getElementById("disc"), lmEl=document.getElementById("lmonly");
function render(){
  const q=qEl.value.trim().toLowerCase(), d=dEl.value, lm=lmEl.checked;
  const rows=DATA.papers.filter(p=>(!lm||p.lm)&&(!d||p.disc===d)&&
    (!q||(p.tz+p.t+p.au+p.j).toLowerCase().includes(q)));
  rows.sort((a,b)=>b.y-a.y);
  tb.innerHTML=rows.map(p=>{
    const cls=p.disc==="物理学"?"t-phy":p.disc==="化学"?"t-chem":p.disc==="生理学或医学"?"t-med":p.disc==="经济学"?"t-econ":"t-oth";
    const doi=p.doi?`<br><span style="color:#94a3b8;font-size:11px;">DOI: ${p.doi}</span>`:"";
    return `<tr><td>${p.y}</td><td><b>${p.tz}</b><div style="color:#94a3b8;font-size:11px;">${p.t}</div>${doi}</td>
      <td>${p.au}</td><td>${p.j}</td><td>${p.vp||"—"}</td>
      <td><span class="tag ${cls}">${p.field}</span></td>
      <td>${p.lm?"★":""}</td></tr>`;
  }).join("");
  document.getElementById("cnt").textContent=`共 ${rows.length} 条`;
}
qEl.oninput=render; dEl.onchange=render; lmEl.onchange=render; render();
window.addEventListener("resize",()=>{tl.resize();g.resize();jr.resize();lg.resize();});
