const COLORS = {"S01":"#2563eb","S02":"#dc2626","S03":"#059669","S04":"#7c3aed","S05":"#ea580c",
  "S06":"#0891b2","S07":"#db2777","S08":"#65a30d","S09":"#b45309"};
const FIELD_COLOR = {};
const FPALETTE = ["#38bdf8","#f472b6","#facc15","#4ade80","#c084fc","#fb923c","#22d3ee","#a3e635","#f87171","#60a5fa"];
DATA.nodes.forEach(n=>{ if(n.field_id && !(n.field_id in FIELD_COLOR))
  FIELD_COLOR[n.field_id] = FPALETTE[Object.keys(FIELD_COLOR).length % FPALETTE.length]; });

document.getElementById('chips').innerHTML = [
  ['人物',DATA.stats.people],['诺奖得主',DATA.stats.laureates],['师承边',DATA.stats.mentor_edges],
  ['学派',DATA.stats.schools],['合作边',DATA.stats.collab],['研究范式',DATA.stats.paradigms]
].map(([k,v])=>`<div class="chip">${k} <b>${v}</b></div>`).join('');

const schoolSel=document.getElementById('schoolSel');
schoolSel.innerHTML='<option value="">全部学派 / 全部人物</option>'+
  DATA.schools.map(s=>`<option value="${s.id}">${s.name}（${s.members.length}人）</option>`).join('');

function schoolMemberSet(id){const s=DATA.schools.find(x=>x.id===id);return s?new Set(s.members.map(m=>m.name)):null;}
function nameOf(id){const n=DATA.nodes.find(x=>x.id===id);return n?n.name:id;}
function schoolOfPerson(id){const n=DATA.nodes.find(x=>x.id===id);return n?n.school_id:'';}

const ROLE_CN={founder:'奠基人',cofounder:'共同奠基人',member:'成员',student:'学生',postdoc:'博士后',
  second_gen:'第二代',visitor:'访问学者',leader:'学术带头人',translator:'转化者'};

document.getElementById('schoolList').innerHTML = DATA.schools.map(s=>`
  <div class="school" data-id="${s.id}" style="border-left-color:${s.color}">
    <div class="n">${s.name} <span style="color:#64748b;font-weight:400">· ${s.era}起</span></div>
    <div class="m">奠基人 ${s.founder} ｜ 成员 ${s.members.length} · 诺奖 ${s.n_laureate}</div>
    <div class="mem">${s.members.map(m=>`${m.name}${m.year?`<em>(${m.year})</em>`:''} <em>${ROLE_CN[m.role]||m.role}</em>`).join(' ｜ ')}</div>
  </div>`).join('');
document.querySelectorAll('.school').forEach(el=>el.onclick=()=>{schoolSel.value=el.dataset.id;render();});

document.getElementById('pdList').innerHTML = DATA.paradigms.map(p=>`
  <div class="pd"><div class="t">${p.name} <span style="color:#64748b;font-weight:400">${p.year}</span></div>
  <div class="d">奠基人 ${p.founder} ｜ ${p.desc}</div></div>`).join('');

const cats=[...new Set(DATA.nodes.map(n=>n.category))];
document.getElementById('legend').innerHTML = DATA.schools.map(s=>
  `<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')+
  `<span><i style="background:#94a3b8"></i>无学派记录</span>`;

let chart=echarts.init(document.getElementById('graph'),'dark');
let showCollab=true, showLabel=true;

function buildOption(){
  const schoolFilter=schoolSel.value;
  const colorBy=document.getElementById('colorSel').value;
  const layout=document.getElementById('layoutSel').value;
  const keep=schoolFilter?schoolMemberSet(schoolFilter):null;
  const degree={}; DATA.edges.forEach(e=>{degree[e.source]=(degree[e.source]||0)+1;degree[e.target]=(degree[e.target]||0)+1;});
  const colorOf=n=> colorBy==='school'
      ? (n.school_id?COLORS[n.school_id]:'#94a3b8')
      : (FIELD_COLOR[n.field_id]||'#94a3b8');
  const nodes=DATA.nodes.map(n=>({
    id:n.id,name:showLabel?n.name:n.name,
    symbolSize:10+Math.min(degree[n.id]||0,8)*4.5,
    itemStyle:{color:colorOf(n),opacity:(keep&&!keep.has(n.name))?0.12:1,
      borderColor:n.laureate?'#fbbf24':'#0f172a',borderWidth:n.laureate?2:1},
    label:{show:true,color:'#e2e8f0',fontSize:11,
      opacity:(keep&&!keep.has(n.name))?0.15:1},
    category:n.school||'无学派记录',
    _raw:n
  }));
  const links=DATA.edges.map(e=>({
    source:e.source,target:e.target,
    lineStyle:{color:'#38bdf8',width:1.6,curveness:0.08,opacity:(keep?0.5:0.75)},
    label:{show:showLabel,formatter:e.label,fontSize:9,color:'#7dd3fc'},
    tooltip:{formatter:()=>`<b>${nameOf(e.source)} → ${nameOf(e.target)}</b><br/>类型：${e.label}<br/>博士阶段：${e.isPhd}<br/>起始：${e.year||'—'}<br/>核验：${e.status}<br/><span style="color:#94a3b8">${e.note||''}</span>`}
  }));
  if(showCollab){
    DATA.cedges.forEach(e=>links.push({
      source:e.source,target:e.target,
      lineStyle:{color:'#f472b6',width:1.2,type:'dashed',opacity:.5},
      label:{show:false},
      tooltip:{formatter:()=>`<b>合作：${nameOf(e.source)} — ${nameOf(e.target)}</b><br/>${e.topic}<br/>${e.year||''} ${e.pub||''}`}
    }));
  }
  return {
    tooltip:{backgroundColor:'#0b1220',borderColor:'#334155',textStyle:{color:'#e2e8f0',fontSize:12}},
    series:[{
      type:'graph',layout:layout,data:nodes,links:links,
      roam:true,draggable:true,
      force:{repulsion:340,edgeLength:[70,180],gravity:0.06,layoutAnimation:true},
      circular:{rotateLabel:true},
      emphasis:{focus:'adjacency',lineStyle:{width:3.2}},
      label:{position:'right',formatter:p=>p.data.name},
      lineStyle:{color:'#38bdf8'}
    }]
  };
}
function render(){ chart.setOption(buildOption(),true); }
schoolSel.onchange=render;
document.getElementById('colorSel').onchange=render;
document.getElementById('layoutSel').onchange=render;
document.getElementById('toggleCollab').onclick=()=>{showCollab=!showCollab;render();};
document.getElementById('toggleLabel').onclick=()=>{showLabel=!showLabel;render();};
document.getElementById('resetBtn').onclick=()=>{schoolSel.value='';showCollab=true;showLabel=true;render();};
render();
window.addEventListener('resize',()=>chart.resize());
</script>
